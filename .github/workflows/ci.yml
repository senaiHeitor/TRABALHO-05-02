name: CI - Validação de Código

on:
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar Pasta src/
        run: |
          if [ ! -d src ]; then
            echo "❌ Pasta 'src' não encontrada"
            exit 1
          fi
          echo "✅ Pasta 'src' existe"

      - name: Verificar index.html na pasta src
        run: |
          if [ ! -f src/index.html ]; then
            echo "❌ src/index.html não encontrado"
            exit 1
          fi
          echo "✅ src/index.html encontrado"

      - name: Verificar CSS na pasta correta
        run: |
          if [ ! -f src/css/style.css ]; then
            echo "❌ src/css/style.css não encontrado"
            exit 1
          fi
          echo "✅ src/css/style.css encontrado"

      - name: Verificar footer com nome do aluno
        run: |
          if ! grep -q "Heitor Tavares" src/index.html; then
            echo "❌ Footer deve conter o nome do aluno (Heitor Tavares)"
            exit 1
          fi
          echo "✅ Nome do aluno encontrado no footer"

      - name: Instalar validadores
        run: |
          npm install -g htmlhint

      - name: Linter HTML
        run: htmlhint src/index.html

      - name: 📋 Relatório de Auditoria
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "✅ AUDITORIA DE CÓDIGO CONCLUÍDA"
          echo "=========================================="
          echo ""
          echo "O código do aluno Heitor Tavares foi auditado, está seguindo as normas corretas e está pronto para o deploy!"
          echo ""
          echo "=========================================="
